services:
  db:
    image: postgres:16-alpine
    container_name: apex-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex_local_dev_only
      POSTGRES_DB: apex_dev
    ports:
      - "54329:5432"
    volumes:
      - apex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex -d apex_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  apex_postgres_data:
