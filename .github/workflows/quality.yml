name: APEX Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, fix/apex-launch-polish]

permissions:
  contents: read

concurrency:
  group: apex-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application and database schema
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: apex_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d apex_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/apex_ci?schema=public
      BETTER_AUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      BETTER_AUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Export generated npm lockfile
        uses: actions/upload-artifact@v4
        with:
          name: apex-generated-package-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 1

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply all migrations to clean PostgreSQL
        run: npx prisma migrate deploy

      - name: Verify rate-limit cleanup dry run
        run: npm run db:cleanup-rate-limits

      - name: TypeScript check
        run: npm run typecheck

      - name: API security tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Chromium for browser smoke tests
        run: npx playwright install --with-deps chromium

      - name: Browser smoke tests
        run: npm run test:e2e
